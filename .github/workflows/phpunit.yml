name: PHPUnit

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: [10, 11, 12, 13]
        include:
          - laravel: 10
            testbench: 8
          - laravel: 11
            testbench: 9
          - laravel: 12
            testbench: 10
          - laravel: 13
            testbench: 11
        exclude:
          # Laravel 10 supports PHP 8.1 - 8.3 only
          - php: '8.4'
            laravel: 10

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none

      - name: Install dependencies
        run: composer update --with="orchestra/testbench:^${{ matrix.testbench }}.0" --prefer-dist --prefer-stable --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit
